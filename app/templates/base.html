<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block titulo %}Mi Tienda Virtual{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header class="header">

        <div class="contenedor">

            <h1>Mi Tienda Virtual</h1>

            <nav>
                <a href="{{ url_for('main.index') }}">Catálogo</a>
                <a href="{{ url_for('main.categorias') }}">Categorías</a>
            </nav>

        </div>

    </header>


    <main class="contenedor contenido">

        {% block contenido %}
        {% endblock %}

    </main>


    <footer class="footer">

        <div class="contenedor">
            <p>Mi Tienda Virtual &copy; 2026</p>
        </div>

    </footer>

</body>
</html>
